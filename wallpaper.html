<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Wallpaper Preview - Azad Vault</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@800&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        :root {
            --bg-dark: #0A0A0C;
            --surface-dark: #1E1E24;
            --text-primary: #FFFFFF;
            --text-secondary: #A0A0B0;
            --theme-accent: #E63946; 
            --glass-bg: rgba(30, 30, 36, 0.75);
            --glass-border: rgba(255, 255, 255, 0.08);
            --theme-maroon: #8B0000;
            --theme-maroon-dark: #4A0000;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-primary); padding-bottom: 90px; overflow-x: hidden; }

        /* Header */
        header {
            position: sticky; top: 0; z-index: 100;
            padding: 15px 5%;
            background: var(--glass-bg);
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--glass-border);
            display: flex; align-items: center; justify-content: space-between;
        }
        .back-btn { color: white; text-decoration: none; font-size: 18px; cursor: pointer; }
        .brand-small { font-family: 'Playfair Display', serif; font-size: 20px; font-weight: 800; }
        .brand-small span { color: var(--theme-accent); }

        /* Preview Container */
        .container { padding: 30px 5%; display: flex; flex-direction: column; align-items: center; }
        #dynamic-preview-title { margin-bottom: 25px; font-size: 20px; font-weight: 600; text-align: center; }

        /* Smart Device Frames */
        .device-container { position: relative; margin-bottom: 40px; transition: 0.5s; }
        .device-container img { width: 100%; height: 100%; object-fit: cover; display: none; }

        /* Mobile Mode */
        .mode-mobile {
            width: 280px; aspect-ratio: 9 / 19.5;
            background: #000; border: 10px solid #1a1a1a;
            border-radius: 40px; box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }
        .mode-mobile img { border-radius: 30px; }

        /* Desktop Mode */
        .mode-desktop {
            width: 100%; max-width: 600px; aspect-ratio: 16 / 10;
            background: #000; border: 12px solid #1a1a1a;
            border-radius: 15px 15px 5px 5px; box-shadow: 0 30px 60px rgba(0,0,0,0.6);
        }
        .mode-desktop img { border-radius: 4px; }

        /* Buttons */
        .button-group { display: flex; flex-direction: column; align-items: center; gap: 15px; width: 100%; }
        .btn-download {
            background: linear-gradient(135deg, var(--theme-maroon), var(--theme-maroon-dark));
            color: white; border: none; padding: 16px 50px; border-radius: 50px;
            font-weight: 700; cursor: pointer; width: 100%; max-width: 320px;
            display: flex; align-items: center; justify-content: center; gap: 10px;
            box-shadow: 0 10px 20px rgba(139,0,0,0.3); transition: 0.3s;
        }
        .btn-share {
            background: rgba(255,255,255,0.05); color: white; border: 1px solid var(--glass-border);
            padding: 14px 50px; border-radius: 50px; font-weight: 600; cursor: pointer;
            width: 100%; max-width: 320px; display: none; align-items: center; justify-content: center; gap: 10px;
        }
        .success-bg { background: #28a745 !important; }

        /* Bottom Nav */
        .bottom-nav {
            position: fixed; bottom: 0; left: 0; width: 100%;
            background: var(--glass-bg); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            border-top: 1px solid var(--glass-border);
            display: flex; justify-content: space-around; padding: 12px 0; z-index: 1000;
        }
        .nav-item { display: flex; flex-direction: column; align-items: center; color: var(--text-secondary); text-decoration: none; font-size: 10px; gap: 4px; }
        .nav-item i { font-size: 20px; }
    </style>
</head>
<body>

    <header>
        <div class="back-btn" onclick="goBack()"><i class="fa-solid fa-chevron-left"></i></div>
        <div class="brand-small">Azad<span>Vault</span></div>
        <div style="width:20px;"></div>
    </header>

    <div class="container">
        <h2 id="dynamic-preview-title">Loading...</h2>
        
        <div id="device-switcher" class="device-container mode-mobile">
            <img id="dynamic-preview-img" src="" alt="Preview">
        </div>

        <div class="button-group">
            <button id="dynamic-download-btn" class="btn-download">
                <i class="fas fa-cloud-download-alt"></i> Download Image
            </button>
            <button id="dynamic-share-btn" class="btn-share">
                <i class="fas fa-share-nodes"></i> Share Image
            </button>
        </div>
    </div>

    <nav class="bottom-nav">
        <a class="nav-item" href="index.html"><i class="fa-solid fa-house"></i>Home</a>
        <a class="nav-item" href="search.html"><i class="fa-solid fa-magnifying-glass"></i>Search</a>
        <a class="nav-item" href="biodata.html"><i class="fa-solid fa-file-contract"></i>Biodata</a>
        <a class="nav-item" href="about.html"><i class="fa-solid fa-circle-info"></i>About</a>
    </nav>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const imageUrl = urlParams.get('url') || '';
        const imageTitle = urlParams.get('title') || 'Wallpaper';

        document.addEventListener('DOMContentLoaded', () => {
            const frame = document.getElementById('device-switcher');
            const imgElement = document.getElementById('dynamic-preview-img');
            
            document.getElementById('dynamic-preview-title').innerText = imageTitle;

            // Desktop Frame Checker
            const isDesktop = imageTitle.toLowerCase().includes('desktop') || imageUrl.toLowerCase().includes('desktop');
            if(isDesktop) {
                frame.classList.replace('mode-mobile', 'mode-desktop');
            }

            if(imageUrl) {
                imgElement.src = imageUrl;
                imgElement.style.display = 'block';
                document.getElementById('dynamic-download-btn').onclick = () => downloadImage(imageUrl, imageTitle);
            }
        });

        function goBack() { window.history.length > 1 ? window.history.back() : window.location.href = 'index.html'; }

        async function downloadImage(url, title) {
            const btn = document.getElementById('dynamic-download-btn');
            const shareBtn = document.getElementById('dynamic-share-btn');
            const originalHTML = btn.innerHTML;

            try {
                btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Downloading...';
                const response = await fetch(url);
                const blob = await response.blob();
                const objectUrl = window.URL.createObjectURL(blob);
                
                const a = document.createElement('a');
                a.href = objectUrl;
                a.download = `${title.replace(/\s+/g, '_')}_AzadVault.png`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                
                btn.innerHTML = '<i class="fas fa-check-circle"></i> Downloaded!';
                btn.classList.add('success-bg');
                shareBtn.style.display = 'flex';
                shareBtn.onclick = () => shareImage(url, title);
                
                setTimeout(() => {
                    btn.innerHTML = originalHTML;
                    btn.classList.remove('success-bg');
                }, 3000);
            } catch (error) {
                btn.innerHTML = '<i class="fas fa-exclamation-triangle"></i> Open in Tab';
                window.open(url, '_blank');
            }
        }

        async function shareImage(url, title) {
            if (navigator.share) {
                try {
                    const response = await fetch(url);
                    const blob = await response.blob();
                    const file = new File([blob], `${title}.png`, { type: blob.type });
                    await navigator.share({
                        title: `Azad Vault - ${title}`,
                        files: [file]
                    });
                } catch (err) { console.log("Share failed"); }
            }
        }
    </script>
</body>
</html>
