<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Search - Azad Vault</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, collection, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";
        
        const firebaseConfig = {
            apiKey: "AIzaSyAhjIHv-buPd9HK3Uf52VLxwwJFIZe1H5Y",
            authDomain: "amritone-4bdcd.firebaseapp.com",
            projectId: "amritone-4bdcd",
            storageBucket: "amritone-4bdcd.firebasestorage.app",
            messagingSenderId: "500948842891",
            appId: "1:500948842891:web:36eb457b02445fa3d4978e",
            measurementId: "G-ZSJ73XSSNQ"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.allDesignsData = [];

        async function fetchInitialData() {
            try {
                const q = query(collection(db, "designs"), orderBy("createdAt", "desc"));
                const querySnapshot = await getDocs(q);
                window.allDesignsData = [];
                
                querySnapshot.forEach((doc) => {
                    window.allDesignsData.push(doc.data());
                });

                generateDynamicKeywords(window.allDesignsData);
                renderResults(window.allDesignsData);
            } catch (error) {
                console.error("Error:", error);
            }
        }

        window.executeLiveSearch = function() {
            const queryText = document.getElementById('search-input').value.toLowerCase().trim();
            const suggestionsBox = document.getElementById('search-suggestions');
            
            if (queryText === "") {
                renderResults(window.allDesignsData);
                suggestionsBox.style.display = 'none';
                return;
            }

            const filtered = window.allDesignsData.filter(item => {
                const title = (item.title || "").toLowerCase();
                const tags = Array.isArray(item.keywords) ? item.keywords.join(" ").toLowerCase() : (item.keywords || "").toLowerCase();
                return title.includes(queryText) || tags.includes(queryText);
            });

            renderResults(filtered);

            // Improved Suggestion Logic
            let matches = window.allDesignsData.filter(d => (d.title||'').toLowerCase().includes(queryText)).slice(0, 6);
            if(matches.length > 0) {
                suggestionsBox.innerHTML = matches.map(s => `
                    <div class="suggestion-item" onclick="applyQuickSearch('${s.title.replace(/'/g, "\\'")}')">
                        <i class="fa-solid fa-magnifying-glass"></i>
                        <span>${s.title}</span>
                        <span class="suggestion-type">Wallpaper</span>
                    </div>
                `).join('');
                suggestionsBox.style.display = 'block';
            } else {
                suggestionsBox.style.display = 'none';
            }
        };

        window.applyQuickSearch = function(text) {
            document.getElementById('search-input').value = text;
            document.getElementById('search-suggestions').style.display = 'none';
            executeLiveSearch();
        };

        function generateDynamicKeywords(dataArray) {
            let frequency = {};
            dataArray.forEach(item => {
                if (item.keywords) {
                    let kws = Array.isArray(item.keywords) ? item.keywords : item.keywords.split(/[ ,]+/);
                    kws.forEach(k => {
                        let clean = k.trim().toLowerCase();
                        if (clean.length > 2) frequency[clean] = (frequency[clean] || 0) + 1;
                    });
                }
            });
            let sorted = Object.keys(frequency).sort((a,b) => frequency[b] - frequency[a]).slice(0, 12);
            document.getElementById('dynamic-tags').innerHTML = sorted.map(kw => 
                `<div class="tag" onclick="applyQuickSearch('${kw}')">#${kw}</div>`
            ).join('');
        }

        function renderResults(data) {
            const grid = document.getElementById('search-results');
            if (data.length === 0) {
                grid.innerHTML = `<div class="no-results"><i class="fa-solid fa-ghost"></i><br>Bhai, kuch nahi mila!</div>`;
                return;
            }
            grid.innerHTML = data.map(item => `
                <div class="item-card" onclick="openImagePreview('${item.imageUrl}', '${(item.title || 'Design').replace(/'/g, "\\'")}')">
                    <img src="${item.imageUrl}" alt="Wallpaper" loading="lazy">
                    <div class="card-overlay"><h3>${item.title || ''}</h3></div>
                </div>
            `).join('');
        }

        window.addEventListener('DOMContentLoaded', fetchInitialData);
    </script>

    <style>
        :root {
            --bg-dark: #0A0A0C;
            --surface: #1A1A1E;
            --accent: #E63946; 
            --text-main: #FFFFFF;
            --text-dim: #A0A0B0;
            --glass: rgba(255, 255, 255, 0.05);
            --border: rgba(255, 255, 255, 0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background: var(--bg-dark); color: var(--text-main); padding-bottom: 80px; }

        header {
            position: sticky; top: 0; z-index: 1000;
            padding: 20px 15px;
            background: rgba(10, 10, 12, 0.8);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
        }

        .search-container { position: relative; max-width: 600px; margin: 0 auto; }
        
        .search-bar {
            display: flex; align-items: center;
            background: var(--surface);
            padding: 12px 18px; border-radius: 15px;
            border: 1px solid var(--border);
            transition: 0.3s;
        }
        .search-bar:focus-within { border-color: var(--accent); box-shadow: 0 0 15px rgba(230, 57, 70, 0.2); }
        .search-bar input {
            background: transparent; border: none; outline: none;
            color: white; width: 100%; padding-left: 12px; font-size: 15px;
        }
        .search-bar i { color: var(--accent); font-size: 18px; }

        /* --- Updated Suggestion Box --- */
        .suggestions-box {
            position: absolute; top: calc(100% + 10px); left: 0; right: 0;
            background: rgba(26, 26, 30, 0.98);
            backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--border);
            border-radius: 18px; overflow: hidden;
            z-index: 2000; display: none;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            padding: 6px;
        }
        .suggestion-item {
            padding: 12px 15px; display: flex; align-items: center; gap: 12px;
            cursor: pointer; border-radius: 12px; transition: 0.2s;
        }
        .suggestion-item:hover { background: rgba(255, 255, 255, 0.05); }
        .suggestion-item i { color: var(--text-dim); font-size: 13px; }
        .suggestion-item span { flex: 1; font-size: 14px; }
        .suggestion-type { 
            font-size: 9px; color: var(--accent); font-weight: 700;
            background: rgba(230, 57, 70, 0.1); padding: 2px 8px; border-radius: 5px;
        }

        .tags-row {
            display: flex; gap: 8px; overflow-x: auto;
            padding: 15px 0 5px; scrollbar-width: none;
        }
        .tags-row::-webkit-scrollbar { display: none; }
        .tag {
            background: var(--glass); border: 1px solid var(--border);
            color: var(--text-dim); padding: 6px 16px; border-radius: 12px;
            font-size: 12px; white-space: nowrap; cursor: pointer; transition: 0.3s;
        }
        .tag:hover { border-color: var(--accent); color: white; background: rgba(230, 57, 70, 0.05); }

        .container { padding: 15px; }
        .masonry-grid { column-count: 2; column-gap: 12px; }
        @media (min-width: 768px) { .masonry-grid { column-count: 4; } }

        .item-card { 
            background: var(--surface); border-radius: 14px; overflow: hidden; 
            margin-bottom: 12px; break-inside: avoid; position: relative;
            border: 1px solid var(--border); animation: fadeIn 0.4s ease;
        }
        .item-card img { width: 100%; display: block; }
        .card-overlay { 
            position: absolute; bottom: 0; left: 0; width: 100%; padding: 20px 10px 8px; 
            background: linear-gradient(transparent, rgba(0,0,0,0.8));
        }
        .card-overlay h3 { font-size: 10px; font-weight: 400; opacity: 0.8; }

        .no-results { text-align: center; padding: 80px 0; color: var(--text-dim); }
        
        .bottom-nav {
            position: fixed; bottom: 0; left: 0; width: 100%;
            background: rgba(10, 10, 12, 0.9); backdrop-filter: blur(20px);
            border-top: 1px solid var(--border);
            display: flex; justify-content: space-around; padding: 12px 0; z-index: 1000;
        }
        .nav-item { color: var(--text-dim); text-decoration: none; font-size: 10px; display: flex; flex-direction: column; align-items: center; gap: 4px; }
        .nav-item.active { color: var(--accent); }
        .nav-item i { font-size: 20px; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <header>
        <div class="search-container">
            <div class="search-bar">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="search-input" placeholder="Search for wallpapers..." oninput="executeLiveSearch()" autocomplete="off">
            </div>
            <div id="search-suggestions" class="suggestions-box"></div>
        </div>
        <div class="tags-row" id="dynamic-tags"></div>
    </header>

    <div class="container">
        <div class="masonry-grid" id="search-results"></div>
    </div>

    <nav class="bottom-nav">
        <a class="nav-item" href="index.html"><i class="fa-solid fa-house"></i>Home</a>
        <a class="nav-item active" href="search.html"><i class="fa-solid fa-magnifying-glass"></i>Search</a>
        <a class="nav-item" href="biodata.html"><i class="fa-solid fa-file-contract"></i>Biodata</a>
        <a class="nav-item" href="about.html"><i class="fa-solid fa-circle-info"></i>About</a>
    </nav>

    <script>
        function openImagePreview(imageUrl, title) {
            window.location.href = `wallpaper.html?url=${encodeURIComponent(imageUrl)}&title=${encodeURIComponent(title)}`;
        }
        // Suggestions close when clicking outside
        document.addEventListener('click', (e) => {
            if (!e.target.closest('.search-container')) {
                document.getElementById('search-suggestions').style.display = 'none';
            }
        });
    </script>
</body>
</html>
