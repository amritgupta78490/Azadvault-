<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Creator Vault - Azad Vault</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@800&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, collection, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";
        
        const firebaseConfig = {
            apiKey: "AIzaSyAhjIHv-buPd9HK3Uf52VLxwwJFIZe1H5Y",
            authDomain: "amritone-4bdcd.firebaseapp.com",
            projectId: "amritone-4bdcd",
            storageBucket: "amritone-4bdcd.firebasestorage.app",
            messagingSenderId: "500948842891",
            appId: "1:500948842891:web:36eb457b02445fa3d4978e",
            measurementId: "G-ZSJ73XSSNQ"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const urlParams = new URLSearchParams(window.location.search);
        const creatorName = urlParams.get('name') || "Creator";
        const dpUrl = urlParams.get('dp') || "https://ui-avatars.com/api/?name=Creator";
        const instaLink = urlParams.get('insta') || "#";

        // Setup UI
        document.getElementById('cp-name-text').innerText = creatorName;
        document.getElementById('cp-img').src = dpUrl;
        document.getElementById('cp-follow-btn').onclick = () => window.open(instaLink, '_blank');
        document.title = `${creatorName} - Azad Vault`;

        async function loadCreatorDesigns() {
            const mainGrid = document.getElementById('main-grid');
            const targetCreator = creatorName.toLowerCase();

            try {
                const q = query(collection(db, "designs"), orderBy("createdAt", "desc"));
                const querySnapshot = await getDocs(q);
                let gridHTML = ""; 
                let count = 0;

                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    const postCreator = data.creatorName ? String(data.creatorName).toLowerCase() : "";
                    
                    if (postCreator === targetCreator) {
                        const safeTitle = data.title ? String(data.title).replace(/'/g, "\\'") : 'Design';
                        const imageUrl = data.imageUrl || "";

                        if (imageUrl) {
                            gridHTML += `
                                <div class="item-card" onclick="openImagePreview('${imageUrl}', '${safeTitle}')">
                                    <img src="${imageUrl}" alt="${safeTitle}" loading="lazy">
                                    <div class="card-overlay">
                                        <h3>${safeTitle}</h3>
                                    </div>
                                </div>
                            `;
                            count++;
                        }
                    }
                });
                
                if (count > 0) {
                    mainGrid.innerHTML = gridHTML; 
                } else {
                    mainGrid.innerHTML = `<div class="no-results"><i class="fa-solid fa-ghost"></i><br>No designs uploaded by ${creatorName} yet.</div>`;
                }
            } catch (error) {
                console.error("Error fetching designs: ", error);
            }
        }

        window.addEventListener('DOMContentLoaded', loadCreatorDesigns);
    </script>

    <style>
        :root {
            --bg-dark: #0A0A0C;
            --surface-dark: #1E1E24;
            --text-primary: #FFFFFF;
            --text-secondary: #A0A0B0;
            --theme-accent: #E63946; 
            --glass-bg: rgba(30, 30, 36, 0.75);
            --glass-border: rgba(255, 255, 255, 0.08);
            --curve-medium: 16px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg-dark); color: var(--text-primary); padding-bottom: 90px; overflow-x: hidden; }

        @keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        /* Header */
        header {
            position: sticky; top: 0; z-index: 100;
            padding: 15px 5%;
            background: var(--glass-bg);
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--glass-border);
            display: flex; align-items: center; justify-content: space-between;
        }

        .back-btn { color: white; text-decoration: none; font-size: 18px; }
        .brand-small { font-family: 'Playfair Display', serif; font-size: 20px; font-weight: 800; }
        .brand-small span { color: var(--theme-accent); }

        /* Creator Profile Banner (Dark Glass) */
        .creator-banner {
            margin: 25px auto; width: 92%; max-width: 500px;
            padding: 25px; border-radius: 24px;
            background: var(--surface-dark);
            border: 1px solid var(--glass-border);
            display: flex; align-items: center; gap: 20px;
            animation: fadeUp 0.6s ease;
        }

        .profile-wrapper { position: relative; }
        .profile-wrapper img { width: 85px; height: 85px; border-radius: 50%; object-fit: cover; border: 2px solid var(--theme-accent); padding: 2px; }
        
        .cp-info h2 { font-size: 20px; margin-bottom: 8px; color: #fff; }
        .btn-follow { 
            background: linear-gradient(135deg, #f09433, #dc2743, #bc1888); 
            color: #fff; border: none; padding: 8px 18px; border-radius: 50px; 
            font-weight: 600; cursor: pointer; font-size: 13px;
            display: flex; align-items: center; gap: 6px;
        }

        /* Masonry Grid */
        .container { padding: 0 5%; max-width: 1600px; margin: auto; }
        .masonry-grid { column-count: 2; column-gap: 15px; padding-bottom: 40px; }
        @media (min-width: 900px) { .masonry-grid { column-count: 4; } }

        .item-card { 
            background: var(--surface-dark); border-radius: var(--curve-medium); overflow: hidden; 
            margin-bottom: 15px; break-inside: avoid; position: relative; cursor: pointer;
            border: 1px solid var(--glass-border); animation: fadeUp 0.6s ease forwards;
        }

        .item-card img { width: 100%; display: block; transition: 0.5s; }
        .item-card:hover img { transform: scale(1.05); }

        .card-overlay { 
            position: absolute; bottom: 0; left: 0; width: 100%; padding: 30px 15px 15px; 
            background: linear-gradient(to top, rgba(0,0,0,0.85), transparent); 
            color: white; opacity: 1; 
        }
        .card-overlay h3 { font-size: 12px; font-weight: 400; opacity: 0.9; }

        .no-results { text-align: center; padding: 50px; color: var(--text-secondary); width: 100%; }
        .no-results i { font-size: 40px; margin-bottom: 15px; opacity: 0.3; }

        /* NATIVE BOTTOM NAVIGATION (Same as Main Website) */
        .bottom-nav {
            position: fixed; bottom: 0; left: 0; width: 100%;
            background: var(--glass-bg); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            border-top: 1px solid var(--glass-border);
            display: flex; justify-content: space-around; padding: 12px 0; z-index: 1000;
        }
        .nav-item { display: flex; flex-direction: column; align-items: center; color: var(--text-secondary); text-decoration: none; font-size: 10px; gap: 4px; }
        .nav-item i { font-size: 20px; }
        .nav-item.active { color: var(--theme-accent); }

    </style>
</head>
<body>

    <header>
        <a href="index.html" class="back-btn"><i class="fa-solid fa-chevron-left"></i></a>
        <div class="brand-small">Azad<span>Vault</span></div>
        <div style="width:20px;"></div>
    </header>

    <div class="creator-banner">
        <div class="profile-wrapper">
            <img id="cp-img" src="" alt="Creator">
        </div>
        <div class="cp-info">
            <h2 id="cp-name-text">Loading...</h2>
            <button id="cp-follow-btn" class="btn-follow">
                <i class="fab fa-instagram"></i> Follow
            </button>
        </div>
    </div>

    <div class="container">
        <p style="margin-bottom: 15px; font-size: 14px; color: var(--text-secondary); font-weight: 500;">Recent Uploads</p>
        <div class="masonry-grid" id="main-grid">
            </div>
    </div>

    <nav class="bottom-nav">
        <a class="nav-item" href="index.html"><i class="fa-solid fa-house"></i>Home</a>
        <a class="nav-item" href="search.html"><i class="fa-solid fa-magnifying-glass"></i>Search</a>
        <a class="nav-item" href="biodata.html"><i class="fa-solid fa-file-contract"></i>Biodata</a>
        <a class="nav-item" href="about.html"><i class="fa-solid fa-circle-info"></i>About</a>
    </nav>

    <script>
        function openImagePreview(imageUrl, title) {
            const encodedUrl = encodeURIComponent(imageUrl);
            const encodedTitle = encodeURIComponent(title);
            window.location.href = `wallpaper.html?url=${encodedUrl}&title=${encodedTitle}`;
        }
    </script>
</body>
</html>
