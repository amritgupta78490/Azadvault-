
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <title>Azad Vault - Free 4K & HD Wallpapers | Online Biodata Maker</title>
    <meta name="description" content="Download premium high-quality 4K, HD, Anime, and Nature mobile wallpapers for free. Create professional biodata online easily. Fast tools by Azad Vault.">
    <meta name="keywords" content="HD wallpapers, 4K wallpapers, mobile wallpapers, anime wallpapers, nature wallpapers, biodata maker, free wallpaper download, wallpaper app India, best wallpaper">
    <meta name="author" content="Azad Vault">

    <link rel="icon" type="image/png" href="https://i.ibb.co/Xrv2gsf2/In-Shot-20260424-163905408.png">

    <!-- Fonts: Plus Jakarta Sans for a highly professional, modern app look + Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, collection, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";
        
        const firebaseConfig = {
            apiKey: "AIzaSyAhjIHv-buPd9HK3Uf52VLxwwJFIZe1H5Y",
            authDomain: "amritone-4bdcd.firebaseapp.com",
            projectId: "amritone-4bdcd",
            storageBucket: "amritone-4bdcd.firebasestorage.app",
            messagingSenderId: "500948842891",
            appId: "1:500948842891:web:36eb457b02445fa3d4978e",
            measurementId: "G-ZSJ73XSSNQ"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.allDesignsData = [];

        async function loadDesigns() {
            const mainGrid = document.getElementById('main-grid');
            if (!mainGrid) return;

            try {
                const q = query(collection(db, "designs"), orderBy("createdAt", "desc"));
                const querySnapshot = await getDocs(q);
                let gridHTML = ""; 

                querySnapshot.forEach((doc, index) => {
                    const data = doc.data();
                    window.allDesignsData.push(data); 

                    const animationDelay = (index % 10) * 0.05; 
                    
                    const safeTitle = data.title ? String(data.title).replace(/'/g, "\\'") : 'Design';
                    const keywords = Array.isArray(data.keywords) ? data.keywords.join(" ").toLowerCase() : String(data.keywords || "").toLowerCase();
                    const category = String(data.category || "other").toLowerCase();
                    const creator = String(data.creator || "").toLowerCase();
                    const imageUrl = data.imageUrl || "";
                    const downloads = data.downloads || 0;

                    if (!imageUrl) return; 

                    gridHTML += `
                        <div class="item-card search-item" data-index="${index}" data-downloads="${downloads}" data-category="${category}" data-keywords="${keywords}" data-creator="${creator}" style="animation-delay: ${animationDelay}s" onclick="openImagePreview('${encodeURIComponent(imageUrl)}', '${encodeURIComponent(safeTitle)}')">
                            <div class="card-img-wrap">
                                <img src="${imageUrl}" alt="${safeTitle} - 4K HD Wallpaper" title="${safeTitle} wallpaper" loading="lazy">
                            </div>
                            <div class="card-content">
                                <h3>${safeTitle}</h3>
                                <div class="downloads-badge"><i class="fa-solid fa-arrow-down"></i> ${downloads}</div>
                            </div>
                        </div>
                    `;
                });
                
                mainGrid.innerHTML = gridHTML; 
                generateDynamicKeywords(window.allDesignsData);

            } catch (error) {
                console.error("Error fetching designs: ", error);
            }
        }

        async function loadCreators() {
            const creatorGrid = document.getElementById('creator-grid');
            if (!creatorGrid) return;

            try {
                const q = query(collection(db, "creators")); 
                const querySnapshot = await getDocs(q);
                let creatorHTML = "";

                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    const name = data.name || "Creator";
                    const safeName = name.replace(/'/g, "\\'");
                    const dpImage = data.dpImage || `https://ui-avatars.com/api/?name=${encodeURIComponent(name)}&background=random&color=fff`;
                    const instaLink = data.instagramLink || "#";

                    creatorHTML += `
                        <div class="creator-item" onclick="openCreatorProfile('${safeName}', '${dpImage}', '${instaLink}')">
                            <div class="story-ring">
                                <img src="${dpImage}" alt="${name} Profile" loading="lazy" onerror="this.src='https://ui-avatars.com/api/?name=${encodeURIComponent(name)}&background=random'">
                            </div>
                            <span class="creator-name">${name}</span>
                        </div>
                    `;
                });
                
                if(creatorHTML !== "") {
                    creatorGrid.innerHTML = creatorHTML; 
                }
            } catch (error) {
                console.error("Error fetching creators: ", error);
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            loadDesigns();
            loadCreators();
        });

        window.openImagePreview = function(url, title) {
            window.location.href = `wallpaper.html?url=${url}&title=${title}`;
        };

        window.openCreatorProfile = function(name, dpUrl, instaLink) {
            window.location.href = `creator.html?name=${encodeURIComponent(name)}&dp=${encodeURIComponent(dpUrl)}&insta=${encodeURIComponent(instaLink)}`;
        };
    </script>

    <style>
        /* === THEME VARIABLES - White & Soft Blue, App-like === */
        :root {
            --bg-body: #F2F5F9; 
            --bg-surface: #FFFFFF;
            --text-primary: #1E293B; 
            --text-secondary: #64748B;
            --accent-main: #3B82F6; 
            --accent-light: #E0E7FF;
            
            /* Curved, Bubbly UI borders */
            --curve-pill: 50px;
            --curve-extreme: 32px;
            --curve-large: 24px;
            --curve-medium: 16px;

            --shadow-hover: 0 20px 40px rgba(59, 130, 246, 0.15);

            color: var(--text-primary); 
            overflow-x: hidden; 
            scroll-behavior: smooth;
            padding-bottom: 90px; 
        }

        @keyframes popIn { 
            0% { opacity: 0; transform: translateY(20px) scale(0.95); }

        /* === SIMPLE HEADER - 3D Floating Glass === */

            position: sticky; top: 0; z-index: 100;
            padding: 15px 5%;
            background: var(--glass-bg);
            backdrop-filter: blur(16px);

            border-bottom: 1px solid rgba(255,255,255,0.5);
            box-shadow: 0 4px 30px rgba(0,0,0,0.03);
            display: flex; justify-content: space-between; align-items: center;
        }

        .brand { display: flex; align-items: center; gap: 10px; }
        .text-logo { font-size: 26px; font-weight: 800; color: var(--text-primary); letter-spacing: -0.5px; }
        .text-logo span { color: var(--accent-main); }
        
        .header-grid-icon {
            font-size: 24px; color: var(--text-primary);
            cursor: pointer; transition: 0.3s;
            background: var(--bg-body); padding: 8px; border-radius: 12px;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.02), 0 2px 8px rgba(0,0,0,0.05);
        }
        .header-grid-icon:hover { color: var(--accent-main); transform: scale(1.05); }

        /* === MAIN SEARCH SECTION === */
        .main-search-section {
            padding: 25px 5% 0; max-width: 1600px; margin: 0 auto;
        }
        .search-container { width: 100%; position: relative; }
        
        /* App-like Search Bar with Visible Blackish Border */
        .header-search {
            display: flex; align-items: center; 
            background: var(--bg-surface);
            border: 2px solid rgba(0, 0, 0, 0.15); /* Visible slight black border */
            box-shadow: 0 6px 20px rgba(0,0,0,0.06), inset 0 2px 4px rgba(0,0,0,0.02);
            border-radius: var(--curve-pill); padding: 14px 24px; width: 100%;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }
        .header-search:focus-within { 
            border-color: #1E293B; /* Darker black/slate on focus */
            box-shadow: 0 0 0 4px var(--accent-light), 0 8px 25px rgba(0, 0, 0, 0.1); 
            transform: translateY(-2px);
        }
        .header-search i { color: var(--text-primary); font-size: 18px; }
        .header-search input { 
            border: none; outline: none; width: 100%; background: transparent;

        }
        .header-search input::placeholder { color: #94A3B8; font-weight: 400; }

        /* Search Suggestions */
        .suggestions-box {
            position: absolute; top: calc(100% + 12px); left: 0; right: 0;
            background: var(--bg-surface); border: 2px solid rgba(0, 0, 0, 0.1);
            border-radius: var(--curve-large); box-shadow: 0 20px 40px rgba(0,0,0,0.15);
            max-height: 280px; overflow-y: auto; z-index: 1000; display: none; padding: 10px;
        }
        .suggestion-item {
            padding: 12px 16px; cursor: pointer; display: flex; align-items: center; justify-content: space-between; 
            border-radius: var(--curve-medium); transition: 0.2s; margin-bottom: 4px;
        }
        .suggestion-item:hover { background: var(--bg-body); transform: translateX(4px); }
        .suggestion-text { color: var(--text-primary); font-size: 14px; font-weight: 500;}
        .suggestion-type { font-size: 11px; color: var(--accent-main); background: var(--accent-light); padding: 4px 10px; border-radius: var(--curve-pill); font-weight: 700; text-transform: uppercase; }

        /* === CREATORS SECTION === */
        .creator-section { padding: 25px 5% 5px; max-width: 1600px; margin: auto; }
        .section-title { font-size: 18px; font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800; color: var(--text-primary); margin-bottom: 15px; letter-spacing: -0.3px; }
        .creator-scroll { display: flex; gap: 20px; overflow-x: auto; padding-bottom: 15px; scrollbar-width: none; }
        .creator-item { display: flex; flex-direction: column; align-items: center; cursor: pointer; min-width: 76px; transition: 0.3s; }
        .creator-item:hover { transform: translateY(-3px); }
        .story-ring {
            width: 72px; height: 72px; border-radius: 50%;
            background: linear-gradient(135deg, #60A5FA 0%, #3B82F6 100%);
            padding: 3px; display: flex; justify-content: center; align-items: center; margin-bottom: 8px;
            box-shadow: 0 8px 15px rgba(59, 130, 246, 0.2);
        }
        .story-ring img { width: 100%; height: 100%; border-radius: 50%; border: 3px solid #fff; object-fit: cover; }
        .creator-name { font-size: 13px; font-weight: 600; color: var(--text-primary); text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 74px; }

        /* === NAVIGATION PILLS === */
        .nav-container { padding: 10px 5%; max-width: 1600px; margin: auto; }
        
        .category-nav { display: flex; gap: 12px; overflow-x: auto; scrollbar-width: none; margin-bottom: 20px; padding: 5px 0; }
        .cat-pill { 
            padding: 12px 28px; background: var(--bg-surface); 
            border: 1px solid rgba(0,0,0,0.05); box-shadow: 0 4px 10px rgba(0,0,0,0.04), var(--shadow-inner);
            border-radius: var(--curve-pill); color: var(--text-secondary); font-weight: 600; font-size: 14px;
            cursor: pointer; transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1); white-space: nowrap;
        }
        .cat-pill:hover { transform: translateY(-2px); box-shadow: 0 6px 15px rgba(0,0,0,0.06), var(--shadow-inner); color: var(--text-primary); }
        .cat-pill.active { 
            background: var(--text-primary); color: white; border-color: var(--text-primary);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2), inset 0 -3px 0 rgba(0,0,0,0.15); 
            transform: translateY(-2px);
        }
        
        .keyword-nav { display: flex; gap: 10px; overflow-x: auto; scrollbar-width: none; padding-bottom: 10px; }
        .kw-tag {
            padding: 8px 18px; background: var(--bg-surface); border: 1px solid #E2E8F0;
            border-radius: var(--curve-large); color: var(--text-secondary); font-size: 13px;
            cursor: pointer; transition: 0.2s; white-space: nowrap; font-weight: 600;
        }
        .kw-tag:hover, .kw-tag.active { background: var(--accent-light); color: var(--accent-main); border-color: var(--accent-light); }

        /* === MASONRY GRID & 3D APP CARDS === */
        .container { padding: 15px 5%; max-width: 1600px; margin: auto; }
        .gallery-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        
        .sort-container { 
            display: flex; background: var(--bg-surface); border-radius: var(--curve-pill); padding: 5px; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.03); border: 1px solid #E2E8F0;
        }
        .sort-btn { 
            cursor: pointer; font-size: 13px; font-weight: 600; color: var(--text-secondary); 
            padding: 8px 18px; border-radius: var(--curve-pill); transition: 0.3s; display: flex; align-items: center; gap: 6px;
        }
        .sort-btn.active { 
            background: var(--text-primary); color: #fff; box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .masonry-grid { column-count: 2; column-gap: 15px; padding-bottom: 40px; }
        @media (min-width: 600px) { .masonry-grid { column-count: 3; } }
        @media (min-width: 900px) { .masonry-grid { column-count: 4; column-gap: 20px;} }
        @media (min-width: 1200px) { .masonry-grid { column-count: 5; } }

        /* 3D Curvy Card Redesign */
        .item-card { 
            background: var(--bg-surface); 
            border-radius: var(--curve-extreme); 
            padding: 8px; /* App-like inner padding */
            margin-bottom: 20px; 
            break-inside: avoid; 
            cursor: pointer; 
            animation: popIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; 
            opacity: 0; 
            box-shadow: var(--shadow-soft);
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            border: 1px solid rgba(255,255,255,0.8);
        }
        .item-card:hover { transform: translateY(-8px) scale(1.02); box-shadow: var(--shadow-hover); border-color: var(--accent-light); }
        
        .card-img-wrap {
            border-radius: var(--curve-large);
            overflow: hidden;
            width: 100%;
        }
        .card-img-wrap img { 
            width: 100%; display: block; object-fit: cover; 
            transition: transform 0.5s ease; 
        }
        .item-card:hover .card-img-wrap img { transform: scale(1.08); }
        
        .card-content {
            padding: 12px 8px 6px;
            display: flex; justify-content: space-between; align-items: center; gap: 10px;
        }
        .card-content h3 { 
            font-size: 13px; font-weight: 700; color: var(--text-primary); margin: 0; 
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-family: 'Plus Jakarta Sans', sans-serif;
        }
        .downloads-badge { 
            font-size: 11px; font-weight: 700; background: var(--bg-body); 
            padding: 5px 10px; border-radius: var(--curve-pill); color: var(--text-secondary); 
            display: flex; align-items: center; gap: 4px; box-shadow: inset 0 2px 4px rgba(0,0,0,0.02); border: 1px solid rgba(0,0,0,0.03);
        }

        .no-results { text-align: center; padding: 60px 20px; color: var(--text-secondary); font-size: 16px; font-weight: 500; }
        .no-results i { font-size: 40px; margin-bottom: 15px; color: #CBD5E1; }

        /* === BOTTOM NAV - Floating Pill === */
        .bottom-nav {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            width: 90%; max-width: 400px;
            background: var(--glass-bg); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); 
            border: 1px solid rgba(255,255,255,0.6); box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            border-radius: var(--curve-pill);
            display: none; justify-content: space-around; padding: 12px 10px; z-index: 100;
        }
        .nav-item { display: flex; flex-direction: column; align-items: center; color: #94A3B8; text-decoration: none; font-size: 10px; font-weight: 600; gap: 5px; cursor: pointer; transition: 0.3s; }
        .nav-item i { font-size: 20px; transition: 0.3s; }
        .nav-item.active { color: var(--text-primary); }
        .nav-item.active i { transform: translateY(-3px); color: var(--accent-main); }

        @media (max-width: 768px) {
            .bottom-nav { display: flex; }
            header { padding-top: 15px; padding-bottom: 15px; }
            .text-logo { font-size: 24px; }
            .item-card { border-radius: var(--curve-large); padding: 6px; }
            .main-search-section { padding-top: 15px; }
        }

        /* === LANDING SCREEN - Pure White & Blue Professional === */
        #landing-screen {
            position: fixed; inset: 0; background: #FFFFFF; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 99999; overflow: hidden; padding: 20px; transition: opacity 0.8s ease, visibility 0.8s;
        }
        #landing-screen::before {
            content: ''; position: absolute; width: 50vw; height: 50vw; max-width: 500px; max-height: 500px;
            background: radial-gradient(circle, rgba(59, 130, 246, 0.15) 0%, rgba(255,255,255,0) 70%);
            border-radius: 50%; filter: blur(40px); animation: floatBlob 8s ease-in-out infinite alternate;
        }
        @keyframes floatBlob { 0% { transform: translate(-30px, -30px) scale(1); } 100% { transform: translate(30px, 30px) scale(1.1); } }
        
        .landing-content { position: relative; z-index: 10; text-align: center; animation: popIn 1s cubic-bezier(0.2, 0.8, 0.2, 1); }
        .landing-logo { font-size: 72px; line-height: 1; font-weight: 800; color: var(--text-primary); margin-bottom: 10px; letter-spacing: -2px; }
        .landing-logo span { color: var(--accent-main); }
        .landing-tagline { color: var(--text-secondary); font-size: 18px; font-weight: 500; letter-spacing: 0.5px; margin-bottom: 40px; }
        
        .loader-pill {
            width: 180px; height: 6px; background: #F1F5F9; border-radius: 10px; margin: 0 auto; overflow: hidden; position: relative;
            box-shadow: inset 0 1px 3px rgba(0,0,0,0.05);
        }
        .loader-progress {
            position: absolute; top: 0; left: 0; height: 100%; width: 40%; background: var(--accent-main); border-radius: 10px;
            animation: loadingSlide 1.5s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        }
        @keyframes loadingSlide { 0% { left: -40%; } 100% { left: 100%; } }

        .skip-btn { 
            position: absolute; top: 30px; right: 30px; background: var(--bg-surface); color: var(--text-primary); border: none; 
            padding: 10px 20px; border-radius: var(--curve-pill); cursor: pointer; font-size: 14px; font-weight: 700;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05); z-index: 20; transition: 0.3s;
        }
        .skip-btn:hover { background: var(--accent-light); color: var(--accent-main); transform: translateY(-2px); }

        @media(max-width: 600px){ .landing-logo { font-size: 50px; } .landing-tagline { font-size: 15px; } .skip-btn { top: 20px; right: 20px; } }

        /* === FOOTER === */
        .site-footer {
            width: 100%; padding: 40px 5% 100px; text-align: center; background: var(--bg-body); border-top: 1px solid #E2E8F0; margin-top: 40px;
        }
        .site-footer p { color: var(--text-secondary); font-size: 14px; margin-bottom: 15px; font-weight: 500; }
        .footer-links { display: flex; justify-content: center; align-items: center; gap: 20px; flex-wrap: wrap; }
        .footer-links a { color: var(--text-primary); text-decoration: none; font-size: 14px; font-weight: 600; transition: 0.3s; background: var(--bg-surface); padding: 8px 16px; border-radius: var(--curve-pill); box-shadow: 0 2px 8px rgba(0,0,0,0.03); }
        .footer-links a:hover { color: var(--accent-main); background: var(--accent-light); }
        
    </style>
</head>
<body>

    <div id="landing-screen">
        <button class="skip-btn" onclick="dismissLanding()">Skip <i class="fa-solid fa-arrow-right" style="margin-left: 5px;"></i></button>
        <div class="landing-content">
            <h1 class="landing-logo">Azad<span>Vault</span></h1>
            <p class="landing-tagline">Premium Wallpapers & Biodata</p>
            <div class="loader-pill"><div class="loader-progress"></div></div>
        </div>
    </div>
    
    <!-- Cleaned Up Header -->
    <header>
        <div class="brand"><h1 class="text-logo">Azad<span>Vault</span></h1></div>
        <i class="fa-solid fa-grip header-grid-icon"></i>
    </header>

    <main>
        <!-- Search bar moved to Main Page -->
        <section class="main-search-section">
            <div class="search-container">
                <div class="header-search">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" id="global-search" placeholder="Find amazing wallpapers, art, creators..." autocomplete="off">
                </div>
                <div id="search-suggestions" class="suggestions-box"></div>
            </div>
        </section>

        <section class="creator-section">
            <div class="section-title">Top Creators</div>
            <div class="creator-scroll" id="creator-grid"></div>
        </section>

        <section class="nav-container">
            <div class="category-nav" id="category-nav">
                <button class="cat-pill active" onclick="filterMainCategory('all', this)">All Wallpapers</button>
                <button class="cat-pill" onclick="filterMainCategory('wallpaper', this)">Exclusives</button>
                <button class="cat-pill" onclick="openBiodataPage()"><i class="fa-solid fa-file-lines" style="margin-right:6px;"></i> Biodata Maker</button>
            </div>
            <div class="keyword-nav" id="dynamic-keyword-tags"><button class="kw-tag"><i class="fa-solid fa-spinner fa-spin"></i> Loading trends...</button></div>
        </section>

        <section class="container">
            <div class="gallery-header">
                <div class="section-title" id="gallery-title" style="margin:0;">Discover Updates</div>
                <div class="sort-container">
                    <span class="sort-btn active" onclick="sortGrid('latest', this)"><i class="fa-solid fa-clock"></i> Latest</span>
                    <span class="sort-btn" onclick="sortGrid('trending', this)"><i class="fa-solid fa-fire"></i> Trending</span>
                </div>
            </div>
            <div class="no-results" id="no-results-msg" style="display:none;"><i class="fa-solid fa-box-open"></i><br><span>No designs found. Try another search.</span></div>
            <div class="masonry-grid" id="main-grid"></div>
        </section>

    <script>
        function generateDynamicKeywords(dataArray) {
            let allKeywords = [];
            dataArray.forEach(item => {
                if (item.keywords) {
                    let kws = Array.isArray(item.keywords) ? item.keywords : item.keywords.split(/[ ,]+/);
                    kws.forEach(k => {
                        let cleanKw = k.trim().toLowerCase();
                        if (cleanKw && cleanKw.length > 2 && cleanKw !== 'wallpaper') allKeywords.push(cleanKw);
                    });
                }
            });
            let frequency = {};
            allKeywords.forEach(k => frequency[k] = (frequency[k] || 0) + 1);
            let sortedKeywords = Object.keys(frequency).sort((a,b) => frequency[b] - frequency[a]).slice(0, 15);
            const kwContainer = document.getElementById('dynamic-keyword-tags');
            if(sortedKeywords.length > 0) {
                const capitalize = s => s.charAt(0).toUpperCase() + s.slice(1);
                kwContainer.innerHTML = sortedKeywords.map(kw => `<button class="kw-tag" onclick="filterByTag('${kw}', this)">${capitalize(kw)}</button>`).join('');
            } else { kwContainer.innerHTML = ''; }
        }

        function filterMainCategory(keyword, btnElement) {
            document.querySelectorAll('.kw-tag').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.cat-pill').forEach(btn => btn.classList.remove('active'));
            if(btnElement) btnElement.classList.add('active');
            document.getElementById('gallery-title').innerText = keyword === 'all' ? "Discover Updates" : "Exclusive Wallpapers";
            executeFilter(keyword, 'category');
        }

        function filterByTag(keyword, btnElement) {
            document.querySelectorAll('.cat-pill').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.kw-tag').forEach(btn => btn.classList.remove('active'));
            if(btnElement) btnElement.classList.add('active');
            document.getElementById('gallery-title').innerText = `Trending: ${keyword.toUpperCase()}`;
            executeFilter(keyword, 'tag');
        }

        function executeFilter(keyword, type) {
            let items = document.querySelectorAll('.search-item');
            let hasResults = false;
            items.forEach(item => {
                let category = item.getAttribute('data-category');
                let tags = item.getAttribute('data-keywords');
                let match = (type === 'category') ? (keyword === 'all' || category.includes(keyword)) : tags.includes(keyword);
                item.style.display = match ? 'block' : 'none';
                if (match) hasResults = true;
            });
            document.getElementById('no-results-msg').style.display = hasResults ? 'none' : 'block';
        }
        
        function openBiodataPage() { window.location.href = "biodata.html"; }

        window.sortGrid = function(type, btnElement) {
            document.querySelectorAll('.sort-btn').forEach(btn => btn.classList.remove('active'));
            if(btnElement) btnElement.classList.add('active');
            let grid = document.getElementById('main-grid');
            let items = Array.from(grid.getElementsByClassName('search-item'));
            if (type === 'trending') {
                items.sort((a, b) => parseInt(b.getAttribute('data-downloads')) - parseInt(a.getAttribute('data-downloads')));
            } else {
                items.sort((a, b) => parseInt(a.getAttribute('data-index')) - parseInt(b.getAttribute('data-index')));
            }
            items.forEach(item => grid.appendChild(item));
        };

        const searchInput = document.getElementById('global-search');
        const suggestionsBox = document.getElementById('search-suggestions');

        searchInput.addEventListener('input', function(e) {
            let query = e.target.value.toLowerCase().trim();
            let items = document.querySelectorAll('.search-item');
            let hasResults = false;
            document.querySelectorAll('.cat-pill, .kw-tag').forEach(btn => btn.classList.remove('active'));
            document.getElementById('gallery-title').innerText = query ? `Search: ${query}` : "Discover Updates";
            items.forEach(item => {
                let title = item.querySelector('h3').innerText.toLowerCase();
                let category = item.getAttribute('data-category') || "";
                let keywords = item.getAttribute('data-keywords') || "";
                let creator = item.getAttribute('data-creator') || "";
                let match = title.includes(query) || keywords.includes(query) || creator.includes(query) || category.includes(query);
                item.style.display = match ? 'block' : 'none';
                if(match) hasResults = true;
            });
            document.getElementById('no-results-msg').style.display = hasResults || query === "" ? 'none' : 'block';
            if (query.length > 0 && window.allDesignsData) {
                let matchedSuggestions = [];
                window.allDesignsData.forEach(data => {
                    let sTitle = (data.title || "").toLowerCase();
                    let sCreator = (data.creator || "").toLowerCase();
                    let sKeywords = Array.isArray(data.keywords) ? data.keywords.join(" ").toLowerCase() : String(data.keywords || "").toLowerCase();
                    if (sTitle.includes(query)) matchedSuggestions.push({ text: data.title, type: 'Title' });
                    else if (sCreator.includes(query)) matchedSuggestions.push({ text: data.creator, type: 'Creator' });
                    else if (sKeywords.includes(query)) {
                        let matchKw = sKeywords.split(" ").find(k => k.includes(query));
                        if(matchKw) matchedSuggestions.push({ text: matchKw, type: 'Tag' });
                    }
                });
                let uniqueSuggestions = Array.from(new Set(matchedSuggestions.map(s => s.text))).map(text => matchedSuggestions.find(s => s.text === text)).slice(0, 5);
                if (uniqueSuggestions.length > 0) {
                    suggestionsBox.innerHTML = uniqueSuggestions.map(s => `<div class="suggestion-item" onclick="applySearch('${s.text.replace(/'/g, "\\'")}')"><span class="suggestion-text"><i class="fa-solid fa-search" style="margin-right:10px; color:#94A3B8;"></i> ${s.text}</span><span class="suggestion-type">${s.type}</span></div>`).join('');
                    suggestionsBox.style.display = 'block';
                } else { suggestionsBox.style.display = 'none'; }
            } else { suggestionsBox.style.display = 'none'; }
        });

        document.addEventListener('click', (e) => { if (!searchInput.contains(e.target) && !suggestionsBox.contains(e.target)) suggestionsBox.style.display = 'none'; });
        window.applySearch = function(text) { searchInput.value = text; suggestionsBox.style.display = 'none'; searchInput.dispatchEvent(new Event('input')); };

        function dismissLanding() {
            const landing = document.getElementById("landing-screen");
            if (landing) { 
                landing.style.opacity = "0"; 
                landing.style.visibility = "hidden";
                setTimeout(() => { landing.style.display = "none"; }, 800); 
                sessionStorage.setItem("landingShown", "true"); 
            }
        }
        
        window.addEventListener("DOMContentLoaded", () => {
            if (sessionStorage.getItem("landingShown") === "true") { document.getElementById("landing-screen").style.display = "none"; }
            else { setTimeout(dismissLanding, 4000); }
        });
    </script>
