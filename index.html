    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, collection, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";
        
        const firebaseConfig = {
            apiKey: "AIzaSyAhjIHv-buPd9HK3Uf52VLxwwJFIZe1H5Y",
            authDomain: "amritone-4bdcd.firebaseapp.com",
            projectId: "amritone-4bdcd",
            storageBucket: "amritone-4bdcd.firebasestorage.app",
            messagingSenderId: "500948842891",
            appId: "1:500948842891:web:36eb457b02445fa3d4978e",
            measurementId: "G-ZSJ73XSSNQ"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.allDesignsData = [];
        window.currentSort = 'latest'; 

        function generateMockDownloads(str) {
            let hash = 0;
            for (let i = 0; i < str.length; i++) {
                hash = str.charCodeAt(i) + ((hash << 5) - hash);
            }
            const mockVal = Math.abs(hash) % 4950 + 50; 
            return mockVal;
        }

        async function loadDesigns() {
            const mainGrid = document.getElementById('main-grid');
            if (!mainGrid) return;

            try {
                const q = query(collection(db, "designs"), orderBy("createdAt", "desc"));
                const querySnapshot = await getDocs(q);
                let gridHTML = ""; 

                querySnapshot.forEach((doc, index) => {
                    const data = doc.data();
                    window.allDesignsData.push(data); 

                    const animationDelay = (index % 10) * 0.03; 
                    
                    const safeTitle = data.title ? String(data.title).replace(/'/g, "\\'") : 'Wallpaper';
                    const keywords = Array.isArray(data.keywords) ? data.keywords.join(" ").toLowerCase() : String(data.keywords || "").toLowerCase();
                    const category = String(data.category || "other").toLowerCase();
                    const creator = String(data.creator || "").toLowerCase();
                    const imageUrl = data.imageUrl || "";
                    
                    let dbDownloads = parseInt(data.downloads) || 0;
                    let displayDownloads = dbDownloads;
                    
                    if (dbDownloads === 0) {
                        displayDownloads = generateMockDownloads(safeTitle + imageUrl);
                    }
                    
                    const formattedDL = displayDownloads >= 1000 ? (displayDownloads/1000).toFixed(1) + 'k' : displayDownloads;

                    if (!imageUrl) return; 

                    const isDesktop = data.isDesktop === true || 
                                      data.orientation === 'desktop' || 
                                      data.orientation === 'landscape' || 
                                      category.includes('desktop') || 
                                      category.includes('pc') || 
                                      category.includes('laptop') ||
                                      keywords.includes('desktop') ||
                                      safeTitle.toLowerCase().includes('desktop'); 

                    const cardClass = isDesktop ? "item-card search-item desktop-card" : "item-card search-item";
                    
                    const desktopParam = isDesktop ? '&isDesktop=true' : '';

                    gridHTML += `
                        <div class="${cardClass}" 
                             data-index="${index}" 
                             data-downloads="${displayDownloads}" 
                             data-category="${category}" 
                             data-keywords="${keywords}" 
                             data-creator="${creator}" 
                             style="animation-delay: ${animationDelay}s;" 
                             onclick="openImagePreview('${encodeURIComponent(imageUrl)}', '${encodeURIComponent(safeTitle)}', ${isDesktop})">
                            
                            <div class="card-img-wrap">
                                <img src="${imageUrl}" alt="${safeTitle} - 4K Wallpaper" title="${safeTitle}" loading="lazy" onerror="this.onerror=null;this.src='https://placehold.co/600x400/0284c7/ffffff?text=Azad+Vault';">
                                <div class="card-badge-dl"><i class="fa-solid fa-download"></i> ${formattedDL}</div>
                                <div class="card-overlay">
                                    <span class="preview-btn"><i class="fa-solid fa-expand"></i> View 4K</span>
                                </div>
                            </div>
                            <div class="card-content">
                                <h3 class="card-title">${safeTitle}</h3>
                                <span class="card-category-tag">${category}</span>
                            </div>
                        </div>
                    `;
                });
                
                mainGrid.innerHTML = gridHTML; 
                generateDynamicKeywords(window.allDesignsData);

            } catch (error) {
                console.error("Error fetching designs: ", error);
            }
        }

        async function loadCreators() {
            const creatorGrid = document.getElementById('creator-grid');
            if (!creatorGrid) return;

            try {
                const q = query(collection(db, "creators")); 
                const querySnapshot = await getDocs(q);
                let creatorHTML = "";

                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    const name = data.name || "Creator";
                    const safeName = name.replace(/'/g, "\\'");
                    const dpImage = data.dpImage || `https://ui-avatars.com/api/?name=${encodeURIComponent(name)}&background=0F172A&color=fff`;
                    const instaLink = data.instagramLink || "#";

                    creatorHTML += `
                        <div class="creator-item" onclick="openCreatorProfile('${safeName}', '${dpImage}', '${instaLink}')">
                            <div class="story-ring">
                                <img src="${dpImage}" alt="${name} Profile" loading="lazy" onerror="this.src='https://ui-avatars.com/api/?name=${encodeURIComponent(name)}&background=0F172A&color=fff'">
                            </div>
                            <span class="creator-name">${name}</span>
                        </div>
                    `;
                });
                
                if(creatorHTML !== "") {
                    creatorGrid.innerHTML = creatorHTML; 
                }
            } catch (error) {
                console.error("Error fetching creators: ", error);
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            loadDesigns();
            loadCreators();
        });

        window.openImagePreview = function(url, title, isDesktop = false) {
             const desktopParam = isDesktop ? '&isDesktop=true' : '';
             window.location.href = `wallpaper.html?url=${url}&title=${title}${desktopParam}`;
        };

        window.openCreatorProfile = function(name, dpUrl, instaLink) {
            window.location.href = `creator.html?name=${encodeURIComponent(name)}&dp=${encodeURIComponent(dpUrl)}&insta=${encodeURIComponent(instaLink)}`;
        };
    </script>

                <div class="header-search">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" id="global-search" placeholder="Search 4K mobile & desktop wallpapers..." autocomplete="off">
                </div>
                <div id="search-suggestions" class="suggestions-box"></div>
            </div>
        </section>

        <!-- Creators Section -->
        <section class="creator-section">
            <div class="section-title"><i class="fa-solid fa-crown" style="color: #0284C7;"></i> Top Creators</div>
            <div class="creator-scroll" id="creator-grid"></div>
        </section>

        <!-- Dynamic Navigation Pills -->
        <section class="nav-container">
            <div class="category-nav" id="category-nav">
                <button class="cat-pill active" onclick="filterMainCategory('all', this)"><i class="fa-solid fa-border-all"></i> All Wallpapers</button>
            </div>
            <div class="keyword-nav" id="dynamic-keyword-tags"><button class="kw-tag"><i class="fa-solid fa-spinner fa-spin"></i> Loading trends...</button></div>
        </section>

        <!-- GALLERY GRID -->
        <section class="container">
            <div class="gallery-header">
                <div class="section-title" id="gallery-title" style="margin:0;"><i class="fa-solid fa-bolt" style="color: #0284C7;"></i> Discover Updates</div>
                
                <!-- Sort Switch -->
                <div class="sort-container">
                    <span class="sort-btn active" id="btn-sort-latest" onclick="sortGrid('latest', this)"><i class="fa-solid fa-clock"></i> Latest</span>
                    <span class="sort-btn" id="btn-sort-trending" onclick="sortGrid('trending', this)"><i class="fa-solid fa-fire"></i> Trending</span>
                </div>
            </div>
            <div class="no-results" id="no-results-msg" style="display:none;"><i class="fa-solid fa-box-open"></i><br><span>No designs found. Try another search query.</span></div>
            <div class="masonry-grid" id="main-grid"></div>
        </section>
    </main>

    <!-- Simple Clear Footer -->
    <footer class="site-footer">
        <p>© 2026 Azad Vault. High quality wallpapers & online tools.</p>
        <div class="footer-links">
            <a href="privacy-policy.html">Privacy Policy</a>
            <a href="about.html">About Us</a>
            <a href="biodata.html">Biodata Maker</a>
        </div>
    </footer>

    <!-- Bottom Nav Dock -->
    <nav class="bottom-nav">
        <a class="nav-item active" href="#" onclick="window.scrollTo({top: 0, behavior: 'smooth'})"><i class="fa-solid fa-house"></i>Home</a>
        <a class="nav-item" href="search.html"><i class="fa-solid fa-magnifying-glass"></i>Search</a>
        <a class="nav-item" href="biodata.html"><i class="fa-solid fa-file-signature"></i>Biodata</a>
        <a class="nav-item" href="about.html"><i class="fa-solid fa-circle-info"></i>About</a>
    </nav>

    <script>
        function generateDynamicKeywords(dataArray) {
            let allKeywords = [];
            dataArray.forEach(item => {
                if (item.keywords) {
                    let kws = Array.isArray(item.keywords) ? item.keywords : item.keywords.split(/[ ,]+/);
                    kws.forEach(k => {
                        let cleanKw = k.trim().toLowerCase();
                        if (cleanKw && cleanKw.length > 2 && cleanKw !== 'wallpaper') allKeywords.push(cleanKw);
                    });
                }
            });
            let frequency = {};
            allKeywords.forEach(k => frequency[k] = (frequency[k] || 0) + 1);
            let sortedKeywords = Object.keys(frequency).sort((a,b) => frequency[b] - frequency[a]).slice(0, 15);
            const kwContainer = document.getElementById('dynamic-keyword-tags');
            if(sortedKeywords.length > 0) {
                const capitalize = s => s.charAt(0).toUpperCase() + s.slice(1);
                kwContainer.innerHTML = sortedKeywords.map(kw => `<button class="kw-tag" onclick="filterByTag('${kw}', this)">${capitalize(kw)}</button>`).join('');
            } else { kwContainer.innerHTML = ''; }
        }

        function filterMainCategory(keyword, btnElement) {
            document.querySelectorAll('.kw-tag').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.cat-pill').forEach(btn => btn.classList.remove('active'));
            if(btnElement) btnElement.classList.add('active');
            document.getElementById('gallery-title').innerText = "Discover Updates";
            executeFilter('all', 'category');
        }

        function filterByTag(keyword, btnElement) {
            document.querySelectorAll('.cat-pill').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.kw-tag').forEach(btn => btn.classList.remove('active'));
            if(btnElement) btnElement.classList.add('active');
            document.getElementById('gallery-title').innerText = `Tag: ${keyword.toUpperCase()}`;
            executeFilter(keyword, 'tag');
        }

        function executeFilter(keyword, type) {
            let items = document.querySelectorAll('.search-item');
            let hasResults = false;
            items.forEach(item => {
                let category = item.getAttribute('data-category') || "";
                let tags = item.getAttribute('data-keywords') || "";

                let match = false;
                if (type === 'category') {
                    if (keyword === 'all') match = true;
                } else {
                    match = tags.includes(keyword);
                }

                // Masonry columns require inline-block instead of flex to render safely
                item.style.display = match ? 'inline-block' : 'none'; 
                if (match) hasResults = true;
            });
            document.getElementById('no-results-msg').style.display = hasResults ? 'none' : 'block';
        }

        /* Sort Switch */
        window.sortGrid = function(type, btnElement) {
            document.querySelectorAll('.sort-btn').forEach(btn => btn.classList.remove('active'));
            if(btnElement) btnElement.classList.add('active');
            
            window.currentSort = type;
            let grid = document.getElementById('main-grid');
            if (!grid) return;

            let items = Array.from(grid.getElementsByClassName('search-item'));
            if (items.length === 0) return;

            items.sort((a, b) => {
                if (type === 'trending') {
                    let dlA = parseInt(a.getAttribute('data-downloads')) || 0;
                    let dlB = parseInt(b.getAttribute('data-downloads')) || 0;
                    if (dlB === dlA) {
                        let idxA = parseInt(a.getAttribute('data-index')) || 0;
                        let idxB = parseInt(b.getAttribute('data-index')) || 0;
                        return idxA - idxB;
                    }
                    return dlB - dlA;
                } else {
                    let idxA = parseInt(a.getAttribute('data-index')) || 0;
                    let idxB = parseInt(b.getAttribute('data-index')) || 0;
                    return idxA - idxB;
                }
            });

            grid.innerHTML = "";
            items.forEach((item, idx) => {
                item.style.animation = 'none';
                item.offsetHeight; 
                item.style.animation = `popIn 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards`;
                item.style.animationDelay = `${(idx % 10) * 0.03}s`;
                grid.appendChild(item);
            });
        };

        const searchInput = document.getElementById('global-search');
        const suggestionsBox = document.getElementById('search-suggestions');

        searchInput.addEventListener('input', function(e) {
            let query = e.target.value.toLowerCase().trim();
            let items = document.querySelectorAll('.search-item');
            let hasResults = false;
            document.querySelectorAll('.cat-pill, .kw-tag').forEach(btn => btn.classList.remove('active'));
            document.getElementById('gallery-title').innerText = query ? `Search: ${query}` : "Discover Updates";
            
            items.forEach(item => {
                let title = item.querySelector('.card-title').innerText.toLowerCase();
                let category = item.getAttribute('data-category') || "";
                let keywords = item.getAttribute('data-keywords') || "";
                let creator = item.getAttribute('data-creator') || "";
                let match = title.includes(query) || keywords.includes(query) || creator.includes(query) || category.includes(query);
                
                item.style.display = match ? 'inline-block' : 'none'; 
                if(match) hasResults = true;
            });
            document.getElementById('no-results-msg').style.display = hasResults || query === "" ? 'none' : 'block';
            
            if (query.length > 0 && window.allDesignsData) {
                let matchedSuggestions = [];
                window.allDesignsData.forEach(data => {
                    let sTitle = (data.title || "").toLowerCase();
                    let sCreator = (data.creator || "").toLowerCase();
                    let sKeywords = Array.isArray(data.keywords) ? data.keywords.join(" ").toLowerCase() : String(data.keywords || "").toLowerCase();
                    if (sTitle.includes(query)) matchedSuggestions.push({ text: data.title, type: 'Title' });
                    else if (sCreator.includes(query)) matchedSuggestions.push({ text: data.creator, type: 'Creator' });
                    else if (sKeywords.includes(query)) {
                        let matchKw = sKeywords.split(" ").find(k => k.includes(query));
                        if(matchKw) matchedSuggestions.push({ text: matchKw, type: 'Tag' });
                    }
                });
                
                let uniqueSuggestions = Array.from(new Set(matchedSuggestions.map(s => s.text))).map(text => matchedSuggestions.find(s => s.text === text)).slice(0, 5);
                if (uniqueSuggestions.length > 0) {
                    suggestionsBox.innerHTML = uniqueSuggestions.map(s => `<div class="suggestion-item" onclick="applySearch('${s.text.replace(/'/g, "\\'")}')"><span class="suggestion-text"><i class="fa-solid fa-magnifying-glass" style="margin-right:8px; color:#0284C7;"></i> ${s.text}</span><span class="suggestion-type">${s.type}</span></div>`).join('');
                    suggestionsBox.style.display = 'block';
                } else { suggestionsBox.style.display = 'none'; }
            } else { suggestionsBox.style.display = 'none'; }
        });

        document.addEventListener('click', (e) => { if (!searchInput.contains(e.target) && !suggestionsBox.contains(e.target)) suggestionsBox.style.display = 'none'; });
        window.applySearch = function(text) { searchInput.value = text; suggestionsBox.style.display = 'none'; searchInput.dispatchEvent(new Event('input')); };
    </script>
</body>
</html>
